name: HOME 4.1.0 P6 original ELF item and topic consumers
# Whole-segment disassembly must tolerate executable PT_LOAD embedded data.
on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-p6-consumer-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home41-p6-consumer-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native ARM64 disassembly dependencies and syntax
        run: |
          python -m pip install capstone==5.0.6
          python -m compileall -q tools
      - name: Scan original ELF instruction and reference sources
        run: |
          python tools/home41_native_p6_consumer_scan.py \
            --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf \
            --out derived/4.1.0/native_item_topics/p6_native_consumer_candidates.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('derived/4.1.0/native_item_topics/p6_native_consumer_candidates.json').read_text())
          assert x['target_sha256']=='bdb558f795710a89aee1af7ed3b5de359a4ca0b4fef6dcdca62e597b9d45df7a'
          assert x['instructions_scanned']>100000
          assert x['instruction_hit_counts'].get('owner_0x508_mem_access',0)>0
          print('Insns:',x['instructions_scanned'],'Native candidate counts:',x['instruction_hit_counts'])
          PY
      - name: Publish verified P6 disassembly candidates
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- derived/4.1.0/native_item_topics/p6_native_consumer_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish HOME 4.1.0 P6 native offset and stride candidates'
            git reset --hard HEAD
            git pull --rebase origin 4.1.0
            git push origin HEAD:4.1.0
          fi
