name: HOME 4.1.0 full main.elf Ghidra analysis + SQLite database

on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-ghidra-full-database.yml'
  workflow_dispatch:
    inputs:
      decompile_all:
        description: 'Decompile every Ghidra-discovered function to C (can be slow)'
        required: true
        type: boolean
        default: true
      runner_target:
        description: 'Use GitHub-hosted or an already registered private self-hosted Linux runner'
        type: choice
        required: true
        default: github-hosted
        options:
          - github-hosted
          - self-hosted

permissions:
  contents: read

concurrency:
  group: home41-ghidra-full-database
  cancel-in-progress: false

jobs:
  analyze-main-elf:
    name: Ghidra 12.2 AArch64 main.elf -> native project + SQLite
    runs-on: ${{ inputs.runner_target == 'self-hosted' && fromJSON('["self-hosted", "Linux", "X64", "home41-ghidra"]') || 'ubuntu-latest' }}
    timeout-minutes: 350
    env:
      MAIN_ELF: '57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf'
      ELF_SHA256: 'bdb558f795710a89aee1af7ed3b5de359a4ca0b4fef6dcdca62e597b9d45df7a'
      GHIDRA_ASSET: 'ghidra_12.2_PUBLIC_20261016.zip'
      GHIDRA_DOWNLOAD: 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip'
      GHIDRA_ZIP_SHA256: '2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67'
    steps:
      - name: Checkout original main.elf and Ghidra export tools
        uses: actions/checkout@v4
        with:
          ref: 4.1.0
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf
            tools/ghidra/
            .github/workflows/home41-ghidra-full-database.yml

      - name: Install Java 25 for official Ghidra 12.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare output folders and prove original ELF identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ghidra_work" "$RUNNER_TEMP/ghidra_dist" "$RUNNER_TEMP/home41_out"
          test -s "$MAIN_ELF"
          printf '%s  %s\n' "$ELF_SHA256" "$MAIN_ELF" | sha256sum --check
          python -m py_compile tools/ghidra/home41_build_sqlite.py tools/ghidra/test_home41_build_sqlite.py
          python -m unittest discover -s tools/ghidra -p 'test_*.py' -v
          file "$MAIN_ELF"
          readelf -h "$MAIN_ELF" | grep -E 'ELF64|AArch64|Machine:'

      - name: Download official Ghidra and verify release SHA256
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 8 --output "$RUNNER_TEMP/$GHIDRA_ASSET" "$GHIDRA_DOWNLOAD"
          printf '%s  %s\n' "$GHIDRA_ZIP_SHA256" "$RUNNER_TEMP/$GHIDRA_ASSET" | sha256sum --check
          unzip -q "$RUNNER_TEMP/$GHIDRA_ASSET" -d "$RUNNER_TEMP/ghidra_dist"
          echo "::group::Ghidra distribution layout"
          find "$RUNNER_TEMP/ghidra_dist" -maxdepth 3 -type f -name 'analyzeHeadless' -print
          find "$RUNNER_TEMP/ghidra_dist" -maxdepth 2 -type d -print | head -n 30
          echo "::endgroup::"
          root="$(find "$RUNNER_TEMP/ghidra_dist" -maxdepth 4 -type f -path '*/support/analyzeHeadless' -print -quit)"
          if [ -z "$root" ]; then
            echo "::error::Ghidra distribution has no support/analyzeHeadless"
            find "$RUNNER_TEMP/ghidra_dist" -maxdepth 3 -type f -name '*Headless*' -print | head -n 30
            exit 1
          fi
          chmod +x "$root"
          test -x "$root"
          root="$(dirname "$(dirname "$root")")"
          echo "GHIDRA_HOME=$root" >> "$GITHUB_ENV"
          echo "Verified Ghidra home: $root"

      - name: Fully analyze original ARM64 ELF in Ghidra Headless
        shell: bash
        env:
          DECOMP_REQUESTED: ${{ github.event_name == 'push' || inputs.decompile_all }}
        run: |
          set -euo pipefail
          if [ "$DECOMP_REQUESTED" = "true" ]; then
            mode=all
          else
            mode=none
          fi
          echo "Decompiler mode: $mode"
          # Retain HOME410.gpr + HOME410.rep for editable native Ghidra project.
          timeout --signal=TERM --kill-after=30s 320m \
            "$GHIDRA_HOME/support/analyzeHeadless" \
              "$RUNNER_TEMP/ghidra_work" HOME410 \
              -import "$GITHUB_WORKSPACE/$MAIN_ELF" \
              -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
              -analysisTimeoutPerFile 15000 \
              -max-cpu 2 \
              -postScript Home41Export.java \
                "$RUNNER_TEMP/home41_out/home41_ghidra_events.ndjson.gz" \
                "$mode" 20 \
              -log "$RUNNER_TEMP/home41_out/ghidra_headless.log" \
            2>&1 | tee "$RUNNER_TEMP/home41_out/ghidra_console.log"
          test -s "$RUNNER_TEMP/home41_out/home41_ghidra_events.ndjson.gz"
          test -f "$RUNNER_TEMP/ghidra_work/HOME410.gpr"
          test -d "$RUNNER_TEMP/ghidra_work/HOME410.rep"

      - name: Materialize validated SQLite reverse-engineering DB
        shell: bash
        run: |
          set -euo pipefail
          python tools/ghidra/home41_build_sqlite.py \
            --elf "$MAIN_ELF" \
            --input "$RUNNER_TEMP/home41_out/home41_ghidra_events.ndjson.gz" \
            --out "$RUNNER_TEMP/home41_out/home41_main_410.sqlite" \
            --report "$RUNNER_TEMP/home41_out/home41_ghidra_manifest.json"
          python - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'home41_out'
          manifest = json.loads((root/'home41_ghidra_manifest.json').read_text())
          assert manifest['status'] == 'COMPLETE', manifest
          assert manifest['counts']['function'] > 0
          assert manifest['counts']['instruction'] > 0
          with sqlite3.connect(root/'home41_main_410.sqlite') as db:
              assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
              for table in ['functions', 'instructions', 'references_full', 'decompilation']:
                  print(table, db.execute('SELECT count(*) FROM ' + table).fetchone()[0])
          PY

      - name: Archive editable native Ghidra project database
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/ghidra_work/HOME410.gpr" ] && \
             [ -d "$RUNNER_TEMP/ghidra_work/HOME410.rep" ]; then
            mkdir -p "$RUNNER_TEMP/home41_out"
            tar -I 'zstd -T2 -5' \
              -C "$RUNNER_TEMP/ghidra_work" \
              -cf "$RUNNER_TEMP/home41_out/HOME410_ghidra_project.tar.zst" \
              HOME410.gpr HOME410.rep
            echo "Native project archive exists; examine SQLite manifest for completeness."
          else
            echo "Ghidra did not produce a native project (runner startup/import failed)."
          fi
          ls -lh "$RUNNER_TEMP/home41_out" 2>/dev/null || true

      - name: Upload native Ghidra project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOME41-Ghidra12-native-project
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0
          path: ${{ runner.temp }}/home41_out/HOME410_ghidra_project.tar.zst

      - name: Upload complete SQLite and provenance manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOME41-Ghidra12-SQLite
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/home41_out/home41_main_410.sqlite
            ${{ runner.temp }}/home41_out/home41_ghidra_manifest.json

      - name: Upload raw machine-readable Ghidra export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOME41-Ghidra12-NDJSON
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0
          path: ${{ runner.temp }}/home41_out/home41_ghidra_events.ndjson.gz

      - name: Upload diagnostic logs on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOME41-Ghidra12-diagnostics
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/home41_out/ghidra_headless.log
            ${{ runner.temp }}/home41_out/ghidra_console.log
