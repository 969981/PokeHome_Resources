name: HOME 4.1.0 P7 native item consumers and caller windows
on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-p7-item-caller-context.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home41-p7-item-caller-context
  cancel-in-progress: false
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AArch64 disassembler and syntax verify
        run: |
          python -m pip install capstone==5.0.6
          python -m py_compile tools/home41_native_p7_upstream_calls.py tools/home41_native_p7_caller_windows.py
      - name: Scan all ELF code words and verify 7 direct BL paths
        run: |
          python tools/home41_native_p7_upstream_calls.py \
            --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf \
            --out derived/4.1.0/native_item_topics/p7_item_upstream_calls.json
          python tools/home41_native_p7_caller_windows.py \
            --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf \
            --out docs/UNPACK_P7_NATIVE_ITEM_CALLER_WINDOWS.md
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('derived/4.1.0/native_item_topics/p7_item_upstream_calls.json')
          d=json.loads(p.read_text())
          assert d['elf_sha256']=='bdb558f795710a89aee1af7ed3b5de359a4ca0b4fef6dcdca62e597b9d45df7a'
          assert d['code_words_4byte_scanned']>1000000
          targets={(c['callsite_rva'],c['target_rva']) for c in d['raw_branch_hits_targeting_item_selector_range']}
          assert ('0x4FD4D4','0x4FD0B8') in targets
          assert ('0x4FD830','0x4FD0B8') in targets
          assert ('0x266D58','0x4FD48C') in targets
          print('Unique 4FD0B8 caller PCs and 266D58 upstream verified')
          PY
      - name: Publish direct callers and opcode windows
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- derived/4.1.0/native_item_topics/p7_item_upstream_calls.json docs/UNPACK_P7_NATIVE_ITEM_CALLER_WINDOWS.md
          if ! git diff --cached --quiet; then
            git commit -m 'data: P7 direct Item8 property callers and exact original 4.1.0 ELF opcode windows'
            git reset --hard HEAD
            for n in 1 2 3 4; do
              git pull --rebase origin 4.1.0
              if git push origin HEAD:4.1.0; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
