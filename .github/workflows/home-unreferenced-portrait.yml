name: HOME unreferenced portrait audit
on:
  workflow_dispatch:
  push:
    branches: [research/home-image-resource-audit]
    paths:
      - 'tools/home41_unreferenced_portrait_audit.py'
      - '.github/workflows/home-unreferenced-portrait.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            HomeImageResources/pokemon
            HomeImageResources/pokemon_image_index.csv
            HomeImageResources/research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0 numpy==2.2.6 scikit-image==0.25.2
      - name: Check all portrait RGBA hashes and unreferenced candidates
        run: python tools/home41_unreferenced_portrait_audit.py --root . --out orphan_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home41-unreferenced-portrait-audit
          path: orphan_output/
          if-no-files-found: warn
