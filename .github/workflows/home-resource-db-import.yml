name: HOME resource database import
on:
  workflow_dispatch:
  push:
    branches: [research/home-image-resource-audit]
    paths:
      - 'PokemonResourceDatabase/tools/build_home_resources.py'
      - 'PokemonResourceDatabase/schemas/migrations/**'
      - 'PokemonResourceDatabase/tools/import_native_learnsets.py'
      - 'PokemonResourceDatabase/tools/import_native_scalars.py'
      - 'PokemonResourceDatabase/tools/test_native_v4.py'
      - 'PokemonResourceDatabase/tools/test_native_v3.py'
      - '.github/workflows/home-resource-db-import.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            PokemonResourceDatabase
            tools
            57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf
            HomeImageResources
            57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/pml
            57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/pokemon
            57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/message
            Unpack/57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/pml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv run --no-project python -m unittest discover -s PokemonResourceDatabase/tools -p 'test_*.py' -v
      - run: uv run PokemonResourceDatabase/tools/build_home_resources.py --out dist/home
      - uses: actions/upload-artifact@v4
        with:
          name: home-resource-db-v4
          path: dist/home/
