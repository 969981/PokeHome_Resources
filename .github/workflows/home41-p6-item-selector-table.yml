name: HOME 4.1.0 P6 native item property selector table
on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-p6-item-selector-table.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home41-p6-item-selector-table
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare parser and Capstone AArch64
        run: |
          python -m pip install capstone==5.0.6
          python -m compileall -q tools
      - name: Decode exact 26-way Native property selector routing
        run: |
          python tools/home41_native_item_selector_table.py \
            --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf \
            --out derived/4.1.0/native_item_topics/p6_item_property_selector_routes.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('derived/4.1.0/native_item_topics/p6_item_property_selector_routes.json')
          doc=json.loads(p.read_text())
          assert doc['elf_sha256']=='bdb558f795710a89aee1af7ed3b5de359a4ca0b4fef6dcdca62e597b9d45df7a'
          assert len(doc['rows'])==26
          assert [r['property_selector_u8'] for r in doc['rows']]==list(range(26))
          assert all(r['destination_opcode'] for r in doc['rows'])
          print('native routes:',[r['destination_rva'] for r in doc['rows']])
          PY
      - name: Publish original 26-entry routing table
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- derived/4.1.0/native_item_topics/p6_item_property_selector_routes.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish 26 Native Item8 getter property selector dispatch routes'
            git reset --hard HEAD
            for attempt in 1 2 3 4; do
              git pull --rebase origin 4.1.0
              if git push origin HEAD:4.1.0; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
