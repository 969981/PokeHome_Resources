name: HOME image default object audit
on:
  workflow_dispatch:
  push:
    branches: [research/home-image-resource-audit]
    paths:
      - 'tools/home41_default_object_audit.py'
      - 'tools/home41_default_writer_audit.py'
      - '.github/workflows/home-image-default-object-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            57b83ea8c0af21ef26e2519b9580b373_NCA/0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.6
      - run: python tools/home41_default_object_audit.py --root . --out default_output
      - run: python tools/home41_default_writer_audit.py --root . --out default_output
      - uses: actions/upload-artifact@v4
        with:
          name: home41-default-object-audit
          path: default_output/
          if-no-files-found: error
