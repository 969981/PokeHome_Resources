name: HOME 4.1.0 first request and response direct caller audit

on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-network-direct-callers.yml'
      - 'Android/Smali/tools/audit_home41_network_direct_callers.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  static-callers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '4.1.0'
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/home41-network-direct-callers.yml
            Android/Smali/tools/audit_home41_network_direct_callers.py
            Android/Smali/4.1.0/lib/arm64-v8a/libil2cpp.so
            Unpack/Android/4.1.0/il2cpp/script.json
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static ARM64 decoder and extract direct callsite evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'pyelftools==0.32'
          python -m py_compile Android/Smali/tools/audit_home41_network_direct_callers.py
          python Android/Smali/tools/audit_home41_network_direct_callers.py \
            --binary Android/Smali/4.1.0/lib/arm64-v8a/libil2cpp.so \
            --script Unpack/Android/4.1.0/il2cpp/script.json \
            --output Android/Smali/4.1.0/FIRST_REQUEST_NATIVE_CALLERS.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('Android/Smali/4.1.0/FIRST_REQUEST_NATIVE_CALLERS.json').read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
            f.write('## First request and response native direct BL callers\n\n')
            for k,v in r['targets'].items():
              f.write(f"- {k} ({v['rva']}): {v['count']} direct BL calls\n")
              for caller in v['direct_callers'][:8]:
                f.write(f"  - {caller['callsite_rva']}: {caller['caller_function'][:2]}\n")
            f.write('\nDirect caller is a static link, not proof of actual response status.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home41-first-request-response-caller-audit
          path: Android/Smali/4.1.0/FIRST_REQUEST_NATIVE_CALLERS.json
          retention-days: 7
          if-no-files-found: warn
      - name: Commit static source-based callsite report
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f Android/Smali/4.1.0/FIRST_REQUEST_NATIVE_CALLERS.json
          if ! git diff --cached --quiet; then
            git commit -m 'analysis(home41): save response/status direct caller links [skip ci]'
            for attempt in 1 2 3 4; do
              git fetch origin 4.1.0
              git rebase FETCH_HEAD
              if git push origin HEAD:4.1.0; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
