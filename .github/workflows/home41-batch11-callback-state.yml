name: HOME41 Batch11 Box completion callback and states 8-10
on:
  workflow_dispatch:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-batch11-callback-state.yml'
      - 'tools/ghidra/home41_batch11_callback_state_audit.py'
permissions:
  contents: read
jobs:
  native-callback-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read-only checkout of immutable ELF, analyzers and published target C
        uses: actions/checkout@v4
        with:
          ref: '4.1.0'
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/ghidra/home41_batch07_request_adrp_audit.py
            tools/ghidra/home41_batch09_box_save_cfg.py
            tools/ghidra/home41_batch10_dispatch_audit.py
            tools/ghidra/home41_batch11_callback_state_audit.py
            57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf
            derived/4.1.0/Ghidra_12.2_Run_42763137320/c/_text__0064bb9c.c
            derived/4.1.0/Ghidra_12.2_Run_42763137320/c/_text__0064baec.c
            derived/4.1.0/Ghidra_12.2_Run_42763137320/c/_text__0064b5b0.c
            derived/4.1.0/Ghidra_12.2_Run_42763137320/c/_text__00317c34.c
            derived/4.1.0/Ghidra_12.2_Run_42763137320/c/_text__0064ba4c.c
            derived/4.1.0/Ghidra_12.2_Run_42763137320/c/_text__0064bab8.c
            derived/4.1.0/Ghidra_12.2_Run_42763137320/c/_text__0064bad0.c
            derived/4.1.0/Ghidra_12.2_Run_42763137320/c/_text__0034e638.c
            derived/4.1.0/Ghidra_12.2_Run_42763137320/c/_text__00333080.c
            derived/4.1.0/Ghidra_12.2_Run_42763137320/c/_text__003333b0.c
            derived/4.1.0/Ghidra_12.2_Run_42763137320/c/_text__003330e0.c
            derived/4.1.0/Ghidra_12.2_Run_42763137320/c/_text__0029e598.c
            derived/4.1.0/Ghidra_12.2_Run_42763137320/c/_text__0030cc20.c
          persist-credentials: false
      - name: Check script syntax and synthetic instruction assertions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/ghidra/home41_batch11_callback_state_audit.py
          python tools/ghidra/home41_batch11_callback_state_audit.py --self-test
      - name: Recover exact call and state-write provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/home41-batch11"
          python tools/ghidra/home41_batch11_callback_state_audit.py \
            --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf \
            --published-c derived/4.1.0/Ghidra_12.2_Run_42763137320/c \
            --out "$RUNNER_TEMP/home41-batch11/box_callback_state_evidence.json" \
            | tee "$RUNNER_TEMP/home41-batch11/summary.log"
          python - "$RUNNER_TEMP/home41-batch11/box_callback_state_evidence.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p['status']=='STATIC_RESPONSE_TO_STATE_CHAIN_NOT_SERVER_ACK'
          assert p['sha256']=='bdb558f795710a89aee1af7ed3b5de359a4ca0b4fef6dcdca62e597b9d45df7a'
          assert p['direct_branch_transitions']['response_parser_nonzero_to_state9']['reachable_in_conservative_cfg']
          assert p['direct_branch_transitions']['failed_transport_fields_to_error_notification']['reachable_in_conservative_cfg']
          assert len(p['state_windows'])==3 and len(p['published_c'])==13
          print('Pinned native and published C evidence validated; no server ACK inferred.')
          PY
      - name: Upload bounded evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOME41-Batch11-Box-Callback-State-Provenance
          path: ${{ runner.temp }}/home41-batch11/
          retention-days: 30
          if-no-files-found: warn
