name: HOME selector and move guard audit
on:
  workflow_dispatch:
  push:
    branches: [research/home-image-resource-audit]
    paths:
      - 'tools/home41_native_selector_guard.py'
      - 'tools/home41_native_selector_closure.py'
      - '.github/workflows/home-selector-guard.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            57b83ea8c0af21ef26e2519b9580b373_NCA/0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv run tools/home41_native_selector_guard.py --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf --out dist/selector-guard
      - run: uv run tools/home41_native_selector_closure.py --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf --report dist/selector-guard/selector_guard.json --out dist/selector-guard
      - uses: actions/upload-artifact@v4
        with:
          name: home-selector-guard-evidence
          path: dist/selector-guard/
