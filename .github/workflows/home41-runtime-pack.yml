name: HOME 4.1.0 lightweight runtime image pack
on:
  workflow_dispatch:
  push:
    branches: [research/home-image-resource-audit]
    paths:
      - 'tools/home41_runtime_pack.py'
      - '.github/workflows/home41-runtime-pack.yml'
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            HomeImageResources/core
            HomeImageResources/pokemon
            HomeImageResources/pokemon_icons
            HomeImageResources/languages
            HomeImageResources/origins
            HomeImageResources/research/origin_swizzle
            HomeImageResources/native_names
            tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Build verified compact pack
        run: python tools/home41_runtime_pack.py --source HomeImageResources --out "$RUNNER_TEMP/home41-images" --profile compact
      - name: Verify package
        run: python tools/home41_runtime_pack.py --out "$RUNNER_TEMP/home41-images" --verify
      - uses: actions/upload-artifact@v4
        with:
          name: home41-runtime-compact
          path: ${{ runner.temp }}/home41-images
          retention-days: 14
          compression-level: 0
