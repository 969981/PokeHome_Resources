name: HOME Android 4.1.0 earliest ID read-only smoke tests
on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-fast-id-smoke.yml'
      - 'tools/home41_fast_id_probe.py'
      - 'tools/test_home41_fast_id_probe.py'
      - 'tools/home41_guest_profile.json'
      - 'tools/home41_guest_onboarding.py'
      - 'tools/test_home41_guest_onboarding.py'
      - 'tools/home41_date_picker_probe.py'
      - 'tools/test_home41_date_picker_probe.py'
      - 'tools/home41_year_anchor_probe.py'
      - 'tools/test_home41_year_anchor_probe.py'
      - 'tools/home41_year_edge_drag_probe.py'
      - 'tools/test_home41_year_edge_drag_probe.py'
      - 'tools/android41_os_anr_recovery.py'
      - 'tools/test_android41_os_anr_recovery.py'
      - 'tools/android41_ui_flow.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '4.1.0'
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test image decoder
        run: python -m pip install pillow
      - name: Syntax check
        run: python -m py_compile tools/home41_fast_id_probe.py tools/test_home41_fast_id_probe.py tools/home41_guest_onboarding.py tools/test_home41_guest_onboarding.py tools/home41_date_picker_probe.py tools/test_home41_date_picker_probe.py tools/home41_year_anchor_probe.py tools/test_home41_year_anchor_probe.py tools/home41_year_edge_drag_probe.py tools/test_home41_year_edge_drag_probe.py tools/android41_os_anr_recovery.py tools/test_android41_os_anr_recovery.py
      - name: Test sanitized no-UI ID watcher (offline fixtures only)
        run: python -m unittest tools/test_home41_fast_id_probe.py tools/test_home41_guest_onboarding.py tools/test_home41_date_picker_probe.py tools/test_home41_year_anchor_probe.py tools/test_home41_year_edge_drag_probe.py tools/test_android41_os_anr_recovery.py -v
