name: HOME 4.1.0 format investigation
on:
  push:
    branches: ['4.1.0']
    paths: ['.github/workflows/home41-p4-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact signatures without inventing decoded fields
        run: |
          python tools/home41_probe_unknown.py
          python -m json.tool docs/UNPACK_P4_SIGNATURES.json >/dev/null
      - name: Publish signature evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UNPACK_P4_SIGNATURES.json
          git commit -m "research: capture real signatures of 65 unresolved HOME assets"
          git push origin HEAD:4.1.0
