name: HOME 4.1.0 Ghidra ELF headless analysis

on:
  workflow_dispatch:
    inputs:
      decompile_limit:
        description: "Number of focus functions to decompile in Ghidra (0 to 54)"
        required: true
        type: choice
        options: ["0","16","32","54"]
        default: "16"

permissions:
  contents: read

jobs:
  ghidra:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout 4.1.0 source repository
        uses: actions/checkout@v4
        with:
          ref: "4.1.0"
          persist-credentials: false

      - name: Verify original ELF and export FDE / direct-call atlas
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/home41_ghidra_elf_atlas.py \
            --elf "57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf" \
            --out "$RUNNER_TEMP/home41-ghidra" --asm
          cat "$RUNNER_TEMP/home41-ghidra/manifest.json"

      - name: Set up JDK 25 for Ghidra 12.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download and verify official Ghidra 12.2 archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" \
            --output "$RUNNER_TEMP/ghidra_12.2_PUBLIC.zip"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $RUNNER_TEMP/ghidra_12.2_PUBLIC.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra-install"
          unzip -q "$RUNNER_TEMP/ghidra_12.2_PUBLIC.zip" -d "$RUNNER_TEMP/ghidra-install"
          find "$RUNNER_TEMP/ghidra-install" -path '*/support/analyzeHeadless' -type f -print

      - name: Ghidra ELF import / autoanalysis / focus C decompilation
        shell: bash
        env:
          DECOMP_LIMIT: ${{ inputs.decompile_limit }}
        run: |
          set -euo pipefail
          headless="$(find "$RUNNER_TEMP/ghidra-install" -path '*/support/analyzeHeadless' -type f -print -quit)"
          test -n "$headless"
          mkdir -p "$RUNNER_TEMP/ghidra-projects" "$RUNNER_TEMP/home41-ghidra/decompiled"
          bash "$headless" "$RUNNER_TEMP/ghidra-projects" HOME41_4_1_0 \
            -import "$GITHUB_WORKSPACE/57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf" \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
            -analysisTimeoutPerFile 2700 \
            -postScript Home41Analyze.java \
              "$RUNNER_TEMP/home41-ghidra/ghidra-results" \
              "$RUNNER_TEMP/home41-ghidra/focus_functions.tsv" "$DECOMP_LIMIT" \
            -log "$RUNNER_TEMP/home41-ghidra/ghidra-headless.log" \
            -scriptlog "$RUNNER_TEMP/home41-ghidra/ghidra-scripts.log"

      - name: Upload actual static atlas and Ghidra C export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home41-ghidra-static-and-decompile
          path: |
            ${{ runner.temp }}/home41-ghidra/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
