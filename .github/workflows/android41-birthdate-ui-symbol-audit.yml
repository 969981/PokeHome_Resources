name: HOME Android 4.1.0 private IL2CPP birthdate dropdown/scroll audit

on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/android41-birthdate-ui-symbol-audit.yml'
      - 'tools/home41_birthdate_ui_symbol_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '4.1.0'
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/android41-birthdate-ui-symbol-audit.yml
            tools/home41_birthdate_ui_symbol_audit.py
            Unpack/Android/4.1.0/il2cpp/script.json
            Unpack/Android/4.1.0/il2cpp/dump.cs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source and process all real static UI entries
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/home41_birthdate_ui_symbol_audit.py
          test -s Unpack/Android/4.1.0/il2cpp/script.json
          python tools/home41_birthdate_ui_symbol_audit.py \
            --script Unpack/Android/4.1.0/il2cpp/script.json \
            --output ci-birthdate-ui/birthdate_ui_method_candidates.json
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('ci-birthdate-ui/birthdate_ui_method_candidates.json').read_text())
          print("Method count:",o['source_method_count'])
          print("UI candidate counts:",o['group_match_total'])
          assert o['source_method_count']>=100000
          assert not o['year_1999_selected']
          assert not o['birthday_submitted']
          PY
      - name: Extract exact birthdate controller field layouts from dump.cs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source=Path("Unpack/Android/4.1.0/il2cpp/dump.cs")
          s=source.read_text(encoding="utf-8-sig")
          import re
          targets=["FirstBootViewInputBirthData", "FirstBootPullDownLabel",
                   "FirstBootBodyController", "CustomTMPDropdownScrollList",
                   "CustomTMPDropdown", "CustomTMPDropdown.OptionData"]
          out={}
          for name in targets:
              pattern=r"(?m)^.*\\bclass\\s+"+re.escape(name)+r"(?=\\s|:)"
              match=re.search(pattern,s)
              pos=match.start() if match is not None else -1
              if pos<0:
                  out[name]={"located":False}
                  continue
              # A class name may appear in namespace declarations or comments;
              # use the first matching class and limit to an independent window.
              start=max(0,s.rfind("// Namespace:",0,pos))
              end=s.find("\n}\n",pos)
              if end<0 or end-pos>35000:
                  end=min(len(s),pos+35000)
              out[name]={"located":True,
                         "class_excerpt":s[start:end+2][:36000]}
          Path("ci-birthdate-ui/birthdate_class_layouts.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print({k:v["located"] for k,v in out.items()})
          assert out["FirstBootViewInputBirthData"]["located"]
          PY
      - name: Upload private, static method-name evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home41-private-birthdate-ui-methods
          path: ci-birthdate-ui/
          retention-days: 5
          if-no-files-found: warn
      - name: Clarify limitations
        if: always()
        shell: bash
        run: |
          {
            echo '## HOME 4.1.0 birthdate UI static method audit'
            echo '- Inspects user private IL2CppDumper ScriptMethod names, not a live HOME session.'
            echo '- No automatic birthday submission, account actions, tokens or server calls.'
            echo '- RVA names are candidates; must inspect native UI callsites before any runtime interaction.'
          } >> "$GITHUB_STEP_SUMMARY"
