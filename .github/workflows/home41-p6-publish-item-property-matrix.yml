name: HOME 4.1.0 P6 publish 26 native item property values
on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-p6-publish-item-property-matrix.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home41-p6-publish-item-property-matrix
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python original resource and ELF routing proof tests
        run: |
          python -m compileall -q tools
          python -m unittest discover -s tools -p test_home41_item_native_properties.py -v
          python -m unittest discover -s tools -p test_home41_native_item_getter.py -v
          python -m unittest discover -s tools -p test_home41_item8_semantic.py -v
          python -m unittest discover -s tools -p test_home41_pokedex_item.py -v
      - name: Export every Native item selector into a mirrored CSV
        run: |
          python tools/unpack_home41.py --root . --out Unpack --kind pokemon --resume
          python tools/unpack_home41.py --root . --out Unpack --verify --kind pokemon --strict
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('Unpack')
          meta=json.loads((root/'_meta/summary.json').read_text())
          assert meta['parser_version']=='mirror-0.9.2'
          assert meta['source_files']==12074
          assert meta['status_counts']=={'converted':6700,'partial':5371,'unsupported':3}
          assert meta['total_outputs']==47850,meta
          manifest=json.loads((root/'_meta/manifest.json').read_text())
          item=next(x for x in manifest['files'] if x['source_path'].endswith('/bin/pml/item/item.dat'))
          assert len(item['outputs'])==8,item
          p=root/'57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/pml/item/item.native_properties.csv'
          with p.open(encoding='utf-8-sig', newline='') as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==1829
          assert len(rows[0])==29
          assert rows[2]['native_s02_watts_price_pkNX']=='40'
          assert rows[100]['native_s04_signed_sprite_pkNX']=='-1'
          assert all(r['native_s12_flags_10_bit5'] in ('0','1') for r in rows)
          assert all(r['native_s13_flags_10_bit6'] in ('0','1') for r in rows)
          assert all(r['native_s24_flags_10_bit7'] in ('0','1') for r in rows)
          assert all(r['native_s25_flags_10_bit13'] in ('0','1') for r in rows)
          print('Published native selectors: 1829 IDs x 26 cases; summary:',meta)
          PY
      - name: Publish verified Native CSV and full manifest
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('Unpack')
          manifest=json.loads((root/'_meta/manifest.json').read_text())
          item=next(x for x in manifest['files'] if x['source_path'].endswith('/bin/pml/item/item.dat'))
          paths=[str(root/o['path']) for o in item['outputs']]
          paths += [str(p) for p in (root/'_meta').glob('*') if p.is_file()]
          for path in paths: subprocess.run(['git','add','-f','--',path],check=True)
          print('stage:',len(paths))
          PY
          if ! git diff --cached --quiet; then
            git commit -m 'data: export original HOME 1829 x 26 native item selector values'
            git reset --hard HEAD
            for attempt in 1 2 3 4; do
              git pull --rebase origin 4.1.0
              if git push origin HEAD:4.1.0; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
