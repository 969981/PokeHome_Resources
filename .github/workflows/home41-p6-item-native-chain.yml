name: HOME 4.1.0 P6 item data-pointer consumer hunt
on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-p6-item-native-chain.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home41-p6-item-native-chain
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and install Capstone
        run: |
          python -m pip install capstone==5.0.6
          python -m py_compile tools/home41_native_p6_item_chain.py
      - name: Confirm native item.dat path caller chain and 48-byte indexing candidates
        run: |
          python tools/home41_native_p6_item_chain.py \
            --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf \
            --out derived/4.1.0/native_item_topics/p6_item_native_chain.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('derived/4.1.0/native_item_topics/p6_item_native_chain.json').read_text())
          assert d['elf_sha256']=='bdb558f795710a89aee1af7ed3b5de359a4ca0b4fef6dcdca62e597b9d45df7a'
          assert d['item_region_instructions']>10000
          assert d['caller_count']['0x50213c_generic_resource_forwarder']>=10
          print('source audited:',d['caller_count'],'stride candidates:',d['candidate_count'])
          PY
      - name: Publish auditable native candidate metadata
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- derived/4.1.0/native_item_topics/p6_item_native_chain.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: original ELF P6 item formatted-path caller graph and 48-byte stride candidates'
            git reset --hard HEAD
            git pull --rebase origin 4.1.0
            git push origin HEAD:4.1.0
          fi
