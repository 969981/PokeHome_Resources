name: HOME 4.1.0 P6 proven Item8 native getter
# Exact producer load is at main+0x4FD76C, not stack-restore at 0x4FD768.
on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-p6-native-item-getter.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home41-p6-native-item-getter
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Python source check and Capstone
        run: |
          python -m pip install capstone==5.0.6
          python -m compileall -q tools
      - name: Real ROMFS all-slot Native Getter test
        run: |
          python -m unittest discover -s tools -p 'test_home41_native_item_getter.py' -v
          python -m unittest discover -s tools -p 'test_home41_item8_semantic.py' -v
      - name: Byte-exact original ELF Native Getter function proof
        run: |
          python tools/home41_native_item_getter_evidence.py \
            --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf \
            --out derived/4.1.0/native_item_topics/p6_item_native_getter_proof.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('derived/4.1.0/native_item_topics/p6_item_native_getter_proof.json').read_text())
          assert d['getter_rva']=='0x4FD784'
          assert d['verified_opcode_count']>=17
          assert d['stride']==48
          print('ELF-native Getter verified:',d['getter_rva'], d['verified_opcode_count'])
          PY
      - name: Git commit original binary verified proof
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- derived/4.1.0/native_item_topics/p6_item_native_getter_proof.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: exact HOME ELF Item8 native record getter and 1832 indexed slot tests'
            git reset --hard HEAD
            git pull --rebase origin 4.1.0
            git push origin HEAD:4.1.0
          fi
