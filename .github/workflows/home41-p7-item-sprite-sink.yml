name: HOME 4.1.0 P7 original ItemSprite business sink
on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-p7-item-sprite-sink.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home41-p7-item-sprite-sink
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original ELF ARM64 tooling
        run: |
          python -m pip install capstone==5.0.6
          python -m py_compile tools/home41_native_p7_item_sprite_sink.py
      - name: Recover item icon format and fallback strings from ELF
        run: |
          python tools/home41_native_p7_item_sprite_sink.py \
            --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf \
            --item 57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/pml/item/item.dat \
            --out derived/4.1.0/native_item_topics/p7_item_sprite_native_sink.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('derived/4.1.0/native_item_topics/p7_item_sprite_native_sink.json').read_text())
          assert d['original_elf_sha256']=='bdb558f795710a89aee1af7ed3b5de359a4ca0b4fef6dcdca62e597b9d45df7a'
          assert d['selected_item_property']==4
          assert d['native_opcode_sites_checked']>=12
          assert d['real_item_samples'][0]['sprite_i16']==2
          assert d['real_item_samples'][1]['sprite_i16']==17
          assert d['real_item_samples'][2]['sprite_i16']==-1
          print('Verified Native Sprite path template and fallback')
          PY
      - name: Persist validated sprite asset path trace
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- derived/4.1.0/native_item_topics/p7_item_sprite_native_sink.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: original HOME item icon Native signed sprite ID and asset path sink'
            git reset --hard HEAD
            for attempt in 1 2 3 4; do
              git pull --rebase origin 4.1.0
              if git push origin HEAD:4.1.0; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
