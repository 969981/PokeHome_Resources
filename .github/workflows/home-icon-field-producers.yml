name: HOME icon field producer evidence
on:
  workflow_dispatch:
  push:
    branches: [research/home-image-resource-audit]
    paths:
      - 'tools/home41_icon_field_producers.py'
      - '.github/workflows/home-icon-field-producers.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            57b83ea8c0af21ef26e2519b9580b373_NCA/0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.6
      - run: |
          python -m py_compile tools/home41_icon_field_producers.py
          python tools/home41_icon_field_producers.py --root . --out producer_audit
      - uses: actions/upload-artifact@v4
        with:
          name: home41-icon-field-producer-evidence
          path: producer_audit/
          if-no-files-found: error
