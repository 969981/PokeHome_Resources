name: HOME Android 4.1.0 static legal-consent UI symbol audit

on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/android41-terms-ui-static-audit.yml'
      - 'tools/home41_terms_ui_symbol_audit.py'
      - 'tools/test_home41_terms_ui_symbol_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '4.1.0'
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/home41_terms_ui_symbol_audit.py
            tools/test_home41_terms_ui_symbol_audit.py
            Unpack/Android/4.1.0/il2cpp/script.json
            Unpack/Android/4.1.0/il2cpp/dump.cs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate parser and scan original IL2CPP method names
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/home41_terms_ui_symbol_audit.py
          PYTHONPATH=tools python -m unittest discover -s tools -p 'test_home41_terms_ui_symbol_audit.py' -v
          test -s Unpack/Android/4.1.0/il2cpp/script.json
          python tools/home41_terms_ui_symbol_audit.py \
            --script Unpack/Android/4.1.0/il2cpp/script.json \
            --output ci-terms-static/method_candidates.json
          python - <<'PY'
          from pathlib import Path
          import json
          report=json.loads(Path('ci-terms-static/method_candidates.json').read_text())
          assert report['source_method_count'] > 100000
          assert not report['terms_ui_tapped']
          assert not report['account_created']
          assert not report['utid_observed']
          print('Static terms candidate count by class group:',report['group_match_total'])
          PY
      - name: Extract original agreement-related UI class fields and method signatures
        shell: bash
        run: |
          python - <<'PY'
          import re, json
          from pathlib import Path
          src=Path("Unpack/Android/4.1.0/il2cpp/dump.cs")
          contents=src.read_text(encoding="utf-8-sig")
          targets=(
              "FirstBootBodyController",
              "FirstBootViewCheckBoxText",
              "FirstBootViewClauseItem",
              "FirstBootViewClausePart",
              "FirstBootViewWideButton",
              "TermsOfServiceConfirmDialog",
              "FirstBootNaLinkDialog",
          )
          classes={}
          for target in targets:
              match=re.search(r"(?m)^.*\bclass\s+"+re.escape(target)+r"(?=\s|:)", contents)
              if match is None:
                  classes[target]={"located":False}
                  continue
              beg=max(0,contents.rfind("// Namespace:",0,match.start()))
              end=contents.find("\n}\n",match.end())
              if end<0 or end-beg>100000:
                  end=min(len(contents),match.start()+100000)
              classes[target]={"located":True,"class_declaration_and_methods":
                               contents[beg:end+2][:100000]}
          Path("ci-terms-static/terms_controller_class_layouts.json").write_text(
              json.dumps(classes,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("Located classes:",{k:v["located"] for k,v in classes.items()})
          assert classes["FirstBootBodyController"]["located"]
          assert classes["FirstBootViewCheckBoxText"]["located"]
          PY
      - name: Extract neighboring FirstBoot mode/phase enum declarations
        shell: bash
        run: |
          python - <<'PY'
          import re,json
          from pathlib import Path
          s=Path("Unpack/Android/4.1.0/il2cpp/dump.cs").read_text(encoding="utf-8-sig")
          marker="class FirstBootBodyController : MonoBehaviour"
          idx=s.find(marker)
          if idx<0:
              raise SystemExit("FirstBootBodyController missing")
          look=s[idx:idx+45000]
          results=[]
          for m in re.finditer(r"(?m)^.*\b(?:enum|class|struct)\s+(?:Phase|Mode|FadeStep)\b",look):
              results.append({"declaration":look[m.start():min(m.start()+2500,len(look))]})
          for i in range(1978,2000):
              found=re.search(r"(?m)^.*TypeDefIndex: "+str(i)+r"\b",look)
              if found:
                  results.append({"typedef_index":i,
                                  "declaration":look[max(0,found.start()-200):
                                                       min(len(look),found.start()+1700)]})
          Path("ci-terms-static/firstboot_enum_neighborhood.json").write_text(
              json.dumps(results,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("Adjacent FirstBoot enum/declaration candidates:",len(results))
          PY
      - name: Upload private source method candidates (not runtime proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home41-terms-ui-static-method-candidates
          path: ci-terms-static/
          retention-days: 5
          if-no-files-found: warn
      - name: State trust boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## HOME 4.1.0 native terms controller candidates'
            echo 'Offline IL2CppDumper method-name analysis only; never confirms a live consent page or actionable button.'
            echo 'No HOME network, credentials, agreement acceptance, Nintendo Account linkage, account creation or UTID read.'
          } >> "$GITHUB_STEP_SUMMARY"
