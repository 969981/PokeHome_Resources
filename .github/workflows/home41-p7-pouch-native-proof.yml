name: HOME 4.1.0 P7 native Pouch consumer proof
on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-p7-pouch-native-proof.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home41-p7-pouch-native-proof
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source and provide AArch64 Capstone
        run: |
          python -m pip install capstone==5.0.6
          python -m py_compile tools/home41_native_p7_pouch_consumers.py tools/test_home41_native_p7_pouch_consumers.py
      - name: Confirm nine Pouch paths and packed inventory item slots
        run: |
          python tools/home41_native_p7_pouch_consumers.py \
            --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf \
            --item 57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/pml/item/item.dat \
            --out derived/4.1.0/native_item_topics/p7_item_pouch_native_consumer.json
          python -m unittest discover -s tools -p test_home41_native_p7_pouch_consumers.py -v
          python -m unittest discover -s tools -p test_home41_item_native_effect_values.py -v
          python -m unittest discover -s tools -p test_home41_item_native_properties.py -v
      - name: Commit exact original ELF inventory business consumer evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- derived/4.1.0/native_item_topics/p7_item_pouch_native_consumer.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: P7 prove item pocket classification and 9 real bag capacities in HOME 4.1.0 ELF'
            git reset --hard HEAD
            for n in 1 2 3 4; do
              git pull --rebase origin 4.1.0
              if git push origin HEAD:4.1.0; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
