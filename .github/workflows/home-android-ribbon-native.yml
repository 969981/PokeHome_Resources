name: HOME Android ribbon native methods
on:
  workflow_dispatch:
  push:
    branches: [research/home-image-resource-audit]
    paths:
      - 'tools/home41_android_ribbon_native.py'
      - '.github/workflows/home-android-ribbon-native.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            Android/Smali/4.1.0/lib/arm64-v8a
            Unpack/Android/4.1.0/il2cpp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.6
      - run: python tools/home41_android_ribbon_native.py --root . --out android_native_output
      - uses: actions/upload-artifact@v4
        with:
          name: home41-android-ribbon-native
          path: android_native_output/
          if-no-files-found: error
