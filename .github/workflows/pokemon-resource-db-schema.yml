name: Pokemon resource database schema
on:
  workflow_dispatch:
  push:
    branches: [research/home-image-resource-audit]
    paths:
      - 'PokemonResourceDatabase/**'
      - '.github/workflows/pokemon-resource-db-schema.yml'
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: PokemonResourceDatabase
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv run PokemonResourceDatabase/tools/schema_manager.py --db dist/schema_v1.sqlite --dictionary dist/csv
      - run: uv run --no-project python -m unittest discover -s PokemonResourceDatabase/tools -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-resource-database-schema-v1
          path: dist/
