name: HOME SysBot SDK cross-repository Windows acceptance
on:
  push:
    branches: ['4.1.0']
    paths: ['.github/workflows/home-sysbot-sdk-matrix-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-sysbot-sdk-matrix-acceptance
  cancel-in-progress: false
env:
  TARGET_SHA: dadcaacaac7543af2c0b866eb5a75cc0d64724ab
  SDK_SHA: 517f14b98515de79504cbcba5a1650cd71aa8050
  SDK_VERSION: 0.1.0-preview.1
jobs:
  prepare:
    if: github.ref == 'refs/heads/4.1.0' && github.repository == '969981/PokeHome_Resources' && github.actor == '969981'
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      target: ${{ steps.install.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 969981/HOME-Live-Plugin-CHS
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.HOME_CORE_EDITOR_PUSH_TOKEN }}
          persist-credentials: false
          path: target
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate pinned candidate DLL and manifest
        id: install
        shell: pwsh
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.HOME_CORE_EDITOR_PUSH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tmp = Join-Path $env:RUNNER_TEMP 'sdk-prepare'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $log = Join-Path $tmp 'prepare.log'
          try {
            if ((git rev-parse HEAD).Trim() -ne $env:TARGET_SHA) { throw 'Pinned target mismatch' }
            $meta = & gh api repos/969981/HOME-Live-Plugin-CHS 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'Cannot verify private target' }
            $repo = $meta | ConvertFrom-Json
            if (-not $repo.private -or $repo.full_name -ne '969981/HOME-Live-Plugin-CHS') { throw 'Unexpected target' }
            $ref = & gh api repos/969981/HOME-Live-Plugin-CHS/git/ref/heads/feat/configurable-sysbot-sdk --jq .object.sha 2>$null
            if ($LASTEXITCODE -ne 0 -or $ref.Trim() -ne $env:TARGET_SHA) { throw 'PR head changed; refusing push' }
            $sdk = Join-Path $tmp 'sdk'
            $feed = Join-Path $tmp 'feed'
            git clone --no-checkout https://github.com/969981/SysBot.Platform.git $sdk *> $log
            if ($LASTEXITCODE -ne 0) { throw 'SDK clone failed' }
            git -C $sdk checkout --detach $env:SDK_SHA *>> $log
            if ($LASTEXITCODE -ne 0 -or (git -C $sdk rev-parse HEAD).Trim() -ne $env:SDK_SHA) { throw 'SDK pin mismatch' }
            dotnet pack "$sdk/src/SysBot.Base/SysBot.Base.csproj" -c Release -o $feed "-p:PackageVersion=$env:SDK_VERSION" "-p:RepositoryCommit=$env:SDK_SHA" *>> $log
            if ($LASTEXITCODE -ne 0) { throw 'SDK pack failed' }
            $pkg = Join-Path $feed "SysBot.Platform.Sdk.$env:SDK_VERSION.nupkg"
            $zip = Join-Path $tmp 'candidate.zip'
            Copy-Item $pkg $zip
            Expand-Archive $zip (Join-Path $tmp 'unpacked')
            $dll = Join-Path $tmp 'unpacked/lib/net10.0/SysBot.Base.dll'
            $dir = "HomeLive.Core/deps/sdk/$env:SDK_VERSION"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item $dll "$dir/SysBot.Base.dll"
            $hash = (Get-FileHash "$dir/SysBot.Base.dll" -Algorithm SHA256).Hash
            [ordered]@{sourceRepository='969981/SysBot.Platform';sourceCommit=$env:SDK_SHA;packageVersion=$env:SDK_VERSION;assemblyVersion=[Reflection.AssemblyName]::GetAssemblyName((Resolve-Path "$dir/SysBot.Base.dll").Path).Version.ToString();dllSha256=$hash;packageSha256=(Get-FileHash $pkg -Algorithm SHA256).Hash;dotnetSdk=(dotnet --version);runId=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT} | ConvertTo-Json | Set-Content "$dir/manifest.json" -Encoding utf8NoBOM
            git add -f -- "$dir/SysBot.Base.dll" "$dir/manifest.json" *>> $log
            if ($LASTEXITCODE -ne 0) { throw 'Staging failed' }
            $staged = @(git diff --cached --name-only)
            if ($staged.Count -ne 2 -or "$dir/SysBot.Base.dll" -notin $staged -or "$dir/manifest.json" -notin $staged) { throw 'Unexpected staged paths' }
            gh auth setup-git --hostname github.com *>> $log
            if ($LASTEXITCODE -ne 0) { throw 'Private authentication failed' }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: vendor pinned SDK candidate DLL with provenance' *>> $log
            if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
            $new = (git rev-parse HEAD).Trim()
            git push 'https://github.com/969981/HOME-Live-Plugin-CHS.git' HEAD:refs/heads/feat/configurable-sysbot-sdk *>> $log
            if ($LASTEXITCODE -ne 0) { throw 'Private non-force push failed' }
            "target=$new" >> $env:GITHUB_OUTPUT
            'Versioned DLL committed to private PR; old binary retained' >> $env:GITHUB_STEP_SUMMARY
          } catch {
            Write-Host '::error::Candidate preparation failed; private details suppressed'
            exit 1
          } finally {
            Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Remove private checkout
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:GITHUB_WORKSPACE 'target') -Recurse -Force -ErrorAction SilentlyContinue
  verify:
    needs: prepare
    if: github.ref == 'refs/heads/4.1.0' && github.repository == '969981/PokeHome_Resources' && github.actor == '969981'
    name: Windows / ${{ matrix.mode }}
    runs-on: windows-2025
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        mode: [Source, Dll, NuGet]
    env:
      SDK_MODE: ${{ matrix.mode }}
      TARGET_SHA: ${{ needs.prepare.outputs.target }}
    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Checkout pinned private target
        uses: actions/checkout@v4
        with:
          repository: 969981/HOME-Live-Plugin-CHS
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.HOME_CORE_EDITOR_PUSH_TOKEN }}
          persist-credentials: false
          path: target
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run strict SDK matrix privately (no device)
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ((git rev-parse HEAD).Trim() -ne $env:TARGET_SHA) { throw 'Pinned target mismatch' }
          $temp = Join-Path $env:RUNNER_TEMP 'home-sdk-private-evidence'
          $feed = Join-Path $env:RUNNER_TEMP 'home-sdk-candidate-feed'
          $sdk = Join-Path $env:RUNNER_TEMP 'home-sdk-public-source'
          New-Item -ItemType Directory -Force $temp | Out-Null
          $ok = $false
          try {
            if ($env:SDK_MODE -eq 'NuGet') {
              $log = Join-Path $temp 'sdk-pack.log'
              git clone --no-checkout https://github.com/969981/SysBot.Platform.git $sdk *> $log
              if ($LASTEXITCODE -ne 0) { throw 'Candidate SDK clone failed' }
              git -C $sdk checkout --detach $env:SDK_SHA *>> $log
              if ($LASTEXITCODE -ne 0 -or (git -C $sdk rev-parse HEAD).Trim() -ne $env:SDK_SHA) { throw 'SDK pin mismatch' }
              dotnet pack "$sdk/src/SysBot.Base/SysBot.Base.csproj" -c Release -o $feed "-p:PackageVersion=$env:SDK_VERSION" "-p:RepositoryCommit=$env:SDK_SHA" *>> $log
              if ($LASTEXITCODE -ne 0) { throw 'SDK pack failed' }
              Get-FileHash "$feed/*.nupkg" -Algorithm SHA256 | Out-String | Add-Content $log
            }
            pwsh -NoProfile -File ./scripts/Invoke-SysBotDependencyMatrix.ps1 -Mode $env:SDK_MODE -Feed $feed -OutputDirectory $temp -PackageVersion $env:SDK_VERSION *> (Join-Path $temp 'matrix-driver.log')
            if ($LASTEXITCODE -ne 0) { throw 'Strict SDK matrix failed' }
            if (-not (Test-Path (Join-Path $temp 'summary.json')) -or -not (Test-Path (Join-Path $temp 'sdk-identities.json'))) { throw 'Required matrix evidence missing' }
            $summary = @(Get-Content (Join-Path $temp 'summary.json') -Raw | ConvertFrom-Json)
            foreach ($stage in @('restore','build','HomeLive.Core.Tests-tests','HomeLive.Host.Tests-tests','sdk-identity')) {
              if (@($summary | Where-Object { $_.name -eq $stage -and $_.status -eq 'PASS' -and $_.exitCode -eq 0 }).Count -ne 1) { throw 'Required matrix stage not passed' }
            }
            if (@($summary | Where-Object { $_.status -ne 'PASS' -or $_.exitCode -ne 0 }).Count) { throw 'Failed matrix stage' }
            $identities = @(Get-Content (Join-Path $temp 'sdk-identities.json') -Raw | ConvertFrom-Json)
            if ($identities.Count -ne 6) { throw 'Incomplete identity evidence' }
            if ($env:SDK_MODE -eq 'Dll') {
              $auditLog = Join-Path $temp 'api-compat.log'
              $tool = Join-Path $env:RUNNER_TEMP 'apicompat-tool'
              dotnet build SysBot.Base/SysBot.Base.csproj -c Release --nologo *> $auditLog
              if ($LASTEXITCODE -ne 0) { throw 'API baseline build failed' }
              dotnet tool install Microsoft.DotNet.ApiCompat.Tool --version 10.0.100 --tool-path $tool *>> $auditLog
              if ($LASTEXITCODE -ne 0) { throw 'ApiCompat installation failed' }
              & (Join-Path $tool 'apicompat.exe') --left SysBot.Base/bin/Release/net10.0/SysBot.Base.dll --right "HomeLive.Core/deps/sdk/$env:SDK_VERSION/SysBot.Base.dll" --enable-rule-cannot-change-parameter-name *>> $auditLog
              if ($LASTEXITCODE -ne 0) { throw 'Public API compatibility audit failed' }
              'Public API compatibility PASS' >> $env:GITHUB_STEP_SUMMARY
            }
            $ok = $true
          } catch {
            $_ | Out-String | Set-Content (Join-Path $temp 'cross-runner-fatal.log')
          }
          if ($ok) {
            Write-Host "$env:SDK_MODE PASS"
            "$env:SDK_MODE PASS (restore, build, regression tests, SDK identities)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Host "::error::SDK matrix failed; private diagnostics suppressed"
            "$env:SDK_MODE FAIL (see private diagnostics)" >> $env:GITHUB_STEP_SUMMARY
            exit 1
          }
      - name: Preserve bounded evidence in private repository only
        if: always() && !cancelled()
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.HOME_CORE_EDITOR_PUSH_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $temp = Join-Path $env:RUNNER_TEMP 'home-sdk-private-evidence'
          if (-not (Test-Path $temp)) { throw 'No private evidence directory' }
          if ((git rev-parse HEAD).Trim() -ne $env:TARGET_SHA) { throw 'Pinned target mismatch' }
          $meta = & gh api repos/969981/HOME-Live-Plugin-CHS 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify private destination' }
          $repo = $meta | ConvertFrom-Json
          if (-not $repo.private -or $repo.full_name -ne '969981/HOME-Live-Plugin-CHS') { throw 'Unexpected destination visibility' }
          $stages = @()
          foreach ($file in Get-ChildItem -LiteralPath $temp -Filter '*.log' -File) {
            $lines = @(Get-Content -LiteralPath $file.FullName)
            $interesting = @($lines | Where-Object { $_ -match 'error|failed|exception|assert|expected|actual|received|passed|total|tests ' } | Select-Object -Last 120)
            $tail = @($lines | Select-Object -Last 40)
            $stages += [ordered]@{stage=$file.BaseName;diagnostics=@($interesting | ForEach-Object { $_.Substring(0,[Math]::Min(1500,$_.Length)) });tail=@($tail | ForEach-Object { $_.Substring(0,[Math]::Min(1500,$_.Length)) })}
          }
          $summary = $null; $identities = $null
          if (Test-Path (Join-Path $temp 'summary.json')) { $summary = Get-Content (Join-Path $temp 'summary.json') -Raw | ConvertFrom-Json }
          if (Test-Path (Join-Path $temp 'sdk-identities.json')) { $identities = Get-Content (Join-Path $temp 'sdk-identities.json') -Raw | ConvertFrom-Json }
          $resolvedPaths = @()
          foreach ($file in Get-ChildItem -LiteralPath $temp -Filter '*.sdk-paths.txt' -File) {
            $resolvedPaths += [ordered]@{project=$file.BaseName;paths=@(Get-Content -LiteralPath $file.FullName)}
          }
          $tests = @()
          foreach ($file in Get-ChildItem -LiteralPath $temp -Filter '*.trx' -File) {
            [xml]$trx = Get-Content -LiteralPath $file.FullName -Raw
            $c = $trx.TestRun.ResultSummary.Counters
            $tests += [ordered]@{file=$file.Name;total=$c.total;executed=$c.executed;passed=$c.passed;failed=$c.failed;notExecuted=$c.notExecuted}
          }
          $dir = 'docs/devlog/ci'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $mode = $env:SDK_MODE.ToLowerInvariant()
          $filePath = "$dir/home-sdk-matrix-$mode-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          [ordered]@{target=$env:TARGET_SHA;sdkCandidate=$env:SDK_SHA;sdkVersion=$env:SDK_VERSION;mode=$env:SDK_MODE;runId=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT;summary=$summary;identities=$identities;resolvedPaths=$resolvedPaths;tests=$tests;stages=$stages} | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $filePath -Encoding utf8NoBOM
          & git add -- $filePath *> (Join-Path $temp 'publish-stage.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Private evidence staging failed' }
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -ne 1 -or $staged[0] -ne $filePath) { throw 'Unexpected staged paths' }
          & gh auth setup-git --hostname github.com *> (Join-Path $temp 'publish-auth.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Private evidence authentication failed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git commit -m 'test: retain private SDK matrix evidence' *> (Join-Path $temp 'publish-commit.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Private evidence commit failed' }
          $branch = "refs/heads/ci/sdk-matrix-$mode-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & git push 'https://github.com/969981/HOME-Live-Plugin-CHS.git' "HEAD:$branch" *> (Join-Path $temp 'publish-push.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Private evidence push failed' }
          'Bounded SDK evidence published privately' >> $env:GITHUB_STEP_SUMMARY
      - name: Remove private diagnostic files
        if: always()
        shell: pwsh
        run: |
          Remove-Item (Join-Path $env:RUNNER_TEMP 'home-sdk-private-evidence') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:GITHUB_WORKSPACE 'target') -Recurse -Force -ErrorAction SilentlyContinue
