name: HOME learnset focused callchain
on:
  workflow_dispatch:
  push:
    branches: [research/home-image-resource-audit]
    paths:
      - 'tools/home41_native_learnset_focus.py'
      - 'tools/home41_native_learnset_dispatch.py'
      - '.github/workflows/home-learnset-focus.yml'
permissions:
  contents: read
jobs:
  focus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            57b83ea8c0af21ef26e2519b9580b373_NCA/0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv run tools/home41_native_learnset_focus.py --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf --out dist/focus
      - run: uv run tools/home41_native_learnset_dispatch.py --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf --out dist/focus
      - uses: actions/upload-artifact@v4
        with:
          name: home-learnset-focused-callchain
          path: dist/focus/
