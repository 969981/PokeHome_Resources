name: HOME Android 4.1.0 Smali complete rebuild (private)

on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-smali-roundtrip.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home41-private-smali-roundtrip
  cancel-in-progress: false

jobs:
  decode-rebuild-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PROJECT: Android/Smali/4.1.0
      ORIGINAL_SHA256: 8dee598028cd70441f645c8fff96b093b76778d625cdf07c60109eced50ffac1
      APKTOOL_VERSION: '3.0.3'
    steps:
      - name: Checkout private destination (sparse)
        uses: actions/checkout@v4
        with:
          ref: '4.1.0'
          filter: blob:none
          sparse-checkout: |
            Android
            .github/workflows
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test shard restore implementation
        run: |
          python -m compileall -q Android/Smali/tools Android/Smali/tests
          python -m unittest discover -s Android/Smali/tests -v

      - name: Obtain exact APK from public Home_Android source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/969981/Home_Android.git "$RUNNER_TEMP/home41-source"
          git -C "$RUNNER_TEMP/home41-source" sparse-checkout set ROMS/4.1.0
          mapfile -t matches < <(find "$RUNNER_TEMP/home41-source/ROMS/4.1.0" -maxdepth 1 -type f -name '*.apk' | sort)
          test "${#matches[@]}" -eq 1
          echo "ORIGINAL_APK=${matches[0]}" >> "$GITHUB_ENV"
          echo "$ORIGINAL_SHA256  ${matches[0]}" | sha256sum -c -
          unzip -t "${matches[0]}" | tail -n 2

      - name: Fetch pinned Apktool 3.0.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar" \
            -o "$RUNNER_TEMP/apktool.jar"
          java -jar "$RUNNER_TEMP/apktool.jar" --version
          sha256sum "$RUNNER_TEMP/apktool.jar" | tee "$RUNNER_TEMP/apktool.sha256"

      - name: Decode complete Smali and Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT"
          java -Xmx4g -jar "$RUNNER_TEMP/apktool.jar" d -f "$ORIGINAL_APK" -o "$PROJECT"
          test -s "$PROJECT/apktool.yml"
          test -s "$PROJECT/AndroidManifest.xml"
          test -d "$PROJECT/res"
          test -d "$PROJECT/assets"
          test -d "$PROJECT/lib/arm64-v8a"
          mapfile -t smali_dirs < <(find "$PROJECT" -mindepth 1 -maxdepth 1 -type d -name 'smali*' | sort)
          test "${#smali_dirs[@]}" -eq 3
          count=$(find "$PROJECT" -type f -name '*.smali' | wc -l)
          echo "Decoded $count Smali files from ${#smali_dirs[@]} DEX containers"
          test "$count" -gt 100
          find "$PROJECT" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort

      - name: Build unsigned reconstructed APK from actual decoded sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/home41-out"
          java -Xmx4g -jar "$RUNNER_TEMP/apktool.jar" b "$PROJECT" \
            -o "$RUNNER_TEMP/home41-out/home41-unsigned.apk"
          unzip -t "$RUNNER_TEMP/home41-out/home41-unsigned.apk" | tail -n 2

      - name: Zipalign, sign with disposable test key, verify and compare DEX
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          tools_dir=$(find "$sdk_dir/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$tools_dir/zipalign"
          test -x "$tools_dir/apksigner"
          test -x "$tools_dir/aapt"
          "$tools_dir/zipalign" -f -p 4 \
            "$RUNNER_TEMP/home41-out/home41-unsigned.apk" \
            "$RUNNER_TEMP/home41-out/home41-aligned.apk"
          keytool -genkeypair -noprompt -alias temporary-test \
            -keyalg RSA -keysize 2048 -validity 2 \
            -keystore "$RUNNER_TEMP/temporary-home41.jks" \
            -storepass changeit -keypass changeit \
            -dname "CN=HOME APK local test build"
          "$tools_dir/apksigner" sign --ks "$RUNNER_TEMP/temporary-home41.jks" \
            --ks-key-alias temporary-test --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --out "$RUNNER_TEMP/home41-out/home41-debug-signed.apk" \
            "$RUNNER_TEMP/home41-out/home41-aligned.apk"
          "$tools_dir/apksigner" verify --verbose \
            "$RUNNER_TEMP/home41-out/home41-debug-signed.apk"
          "$tools_dir/aapt" dump badging "$ORIGINAL_APK" | grep '^package:' | head -n 1 > "$RUNNER_TEMP/original-package.txt"
          "$tools_dir/aapt" dump badging "$RUNNER_TEMP/home41-out/home41-debug-signed.apk" | grep '^package:' | head -n 1 > "$RUNNER_TEMP/rebuilt-package.txt"
          python - <<'PY'
          import os, re, zipfile
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          original = (root/"original-package.txt").read_text().strip()
          rebuilt = (root/"rebuilt-package.txt").read_text().strip()
          for field in ("name", "versionCode", "versionName"):
              expression = rf"{field}='([^']+)'"
              a, b = re.search(expression, original), re.search(expression, rebuilt)
              if not a or not b or a.group(1) != b.group(1):
                  raise SystemExit(f"Package metadata mismatch {field}: {original} vs {rebuilt}")
          with zipfile.ZipFile(os.environ["ORIGINAL_APK"]) as src:
              original_dex = sorted(n for n in src.namelist() if re.fullmatch(r'classes(?:[0-9]+)?\.dex',n))
          with zipfile.ZipFile(root/'home41-out/home41-debug-signed.apk') as dst:
              rebuilt_dex = sorted(n for n in dst.namelist() if re.fullmatch(r'classes(?:[0-9]+)?\.dex',n))
          assert len(original_dex) == len(rebuilt_dex) == 3, (original_dex, rebuilt_dex)
          print("Package metadata verified:", rebuilt)
          print("DEX files rebuilt:", rebuilt_dex)
          PY

      - name: Split large Git blobs, restore, and independently rebuild
        shell: bash
        run: |
          set -euo pipefail
          python Android/Smali/tools/shard_large.py split --root "$PROJECT"
          python Android/Smali/tools/shard_large.py check --root "$PROJECT"
          python Android/Smali/tools/shard_large.py restore --root "$PROJECT"
          java -Xmx4g -jar "$RUNNER_TEMP/apktool.jar" b "$PROJECT" \
            -o "$RUNNER_TEMP/home41-out/home41-from-restored-shards.apk"
          unzip -t "$RUNNER_TEMP/home41-out/home41-from-restored-shards.apk" | tail -n 2
          python Android/Smali/tools/shard_large.py clean --root "$PROJECT"
          if find "$PROJECT" -type f -size +95M | grep -q .; then
            echo "Refusing to commit Git blobs above 95 MiB" >&2
            exit 1
          fi

      - name: Record verifiable provenance and build report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path(os.environ["PROJECT"])
          original = pathlib.Path(os.environ["ORIGINAL_APK"])
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "home41-out"
          def sha(p):
              h = hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda: f.read(4*1024*1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          smali_dirs = sorted(p.name for p in root.iterdir() if p.is_dir() and p.name.startswith("smali"))
          smali_count = sum(1 for p in root.rglob("*.smali") if p.is_file())
          native_count = sum(1 for p in (root/"lib").rglob("*.so"))
          shards = json.loads((root/".large-file-shards.json").read_text())
          report = {
              "source_repo":"969981/Home_Android",
              "source_ref":"master",
              "source_path":"ROMS/4.1.0/",
              "original_sha256":sha(original),
              "apktool_version":os.environ["APKTOOL_VERSION"],
              "smali_directories":smali_dirs,
              "smali_files":smali_count,
              "native_so_files":native_count,
              "large_files_sharded":len(shards["entries"]),
              "decoded_files_in_git_project":sum(1 for p in root.rglob("*") if p.is_file()),
              "first_build_unsigned_sha256":sha(output/"home41-unsigned.apk"),
              "test_signed_apk_sha256":sha(output/"home41-debug-signed.apk"),
              "restored_source_build_sha256":sha(output/"home41-from-restored-shards.apk"),
              "status":"apktool_build_and_shard_rebuild_success",
              "signing":"disposable test certificate; not an original signature",
              "runtime_tested":False,
              "il2cpp_source_recovered":False,
              "workflow_run":f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          }
          assert report["original_sha256"] == os.environ["ORIGINAL_SHA256"]
          assert len(smali_dirs)==3 and smali_count>100 and native_count>=1
          (root/"REBUILD_REPORT.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Upload rebuilt test APKs and reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: home41-smali-rebuild-validation
          path: |
            ${{ runner.temp }}/home41-out/home41-debug-signed.apk
            ${{ runner.temp }}/home41-out/home41-from-restored-shards.apk
            Android/Smali/4.1.0/REBUILD_REPORT.json
            Android/Smali/4.1.0/.large-file-shards.json
          include-hidden-files: true
          retention-days: 7
          compression-level: 0

      - name: Commit actual complete decoded project to private 4.1.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$PROJECT"
          if git diff --cached --quiet; then
            echo "No decoded project changes"
            exit 0
          fi
          echo "Files staged: $(git diff --cached --name-only | wc -l)"
          git commit -m 'build(android): publish complete APKTool Smali v4.1.0 project [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin 4.1.0
            git rebase origin/4.1.0
            if git push origin HEAD:4.1.0; then
              echo "Source project committed to private 4.1.0 branch"
              exit 0
            fi
            sleep "$((attempt * 4))"
          done
          echo "Failed to publish after Git ref moved repeatedly" >&2
          exit 1
