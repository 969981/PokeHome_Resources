name: HOME 4.1.0 CSM.Tarinor native signature callchain audit

on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-signature-native-callchain.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home41-signature-native-callchain
  cancel-in-progress: false

jobs:
  disassemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '4.1.0'
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Android/Smali/tools/trace_signature_unity_native.py
            Android/Smali/4.1.0/lib/arm64-v8a/libil2cpp.so
            Unpack/Android/4.1.0/il2cpp/dump.cs
            Unpack/Android/4.1.0/il2cpp/script.json
            .github/workflows/home41-signature-native-callchain.yml
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only ARM64 disassembler and inspect recovered methods
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'capstone==5.0.6'
          python -m py_compile Android/Smali/tools/trace_signature_unity_native.py
          python Android/Smali/tools/trace_signature_unity_native.py \
            --binary Android/Smali/4.1.0/lib/arm64-v8a/libil2cpp.so \
            --dump Unpack/Android/4.1.0/il2cpp/dump.cs \
            --script Unpack/Android/4.1.0/il2cpp/script.json \
            --output Android/Smali/4.1.0/UNITY_SIGNATURE_NATIVE_TRACE.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('Android/Smali/4.1.0/UNITY_SIGNATURE_NATIVE_TRACE.json').read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
            f.write('## CSM.Tarinor (signature callback), ARM64 read-only static disassembly\n\n')
            f.write(f"- Class: {r['class_context'].get('class_header')}\n")
            for target in r['targets']:
              f.write(f"- {target['method']}: RVA {target['rva']}, instructions {target['decoded_instructions']}\n")
              for call in target['branch_and_call_targets']:
                if call['opcode']=='bl':
                  f.write(f"  - BL {call['target_rva']} {', '.join(call['exact_method_candidates'][:3])}\n")
            f.write('\nNeither these calls nor signature callback execution alone prove backend or client-side rejection.\n')
          PY
      - name: Upload raw static disassembly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home41-csm-tarinor-arm64-callgraph
          path: Android/Smali/4.1.0/UNITY_SIGNATURE_NATIVE_TRACE.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified native trace to private branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f Android/Smali/4.1.0/UNITY_SIGNATURE_NATIVE_TRACE.json
          if ! git diff --cached --quiet; then
            git commit -m 'analysis(android): persist CSM.Tarinor ARM64 branch targets and IL2CPP labels [skip ci]'
            git fetch origin 4.1.0
            git rebase FETCH_HEAD
            git push origin HEAD:4.1.0
          fi
