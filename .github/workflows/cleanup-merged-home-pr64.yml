name: Cleanup merged HOME PR 64 branch
on:
  workflow_dispatch:
  push:
    branches: ['4.1.0']
    paths: ['.github/workflows/cleanup-merged-home-pr64.yml']
permissions:
  contents: read
concurrency:
  group: cleanup-merged-home-pr64
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/4.1.0' && github.repository == '969981/PokeHome_Resources' && github.actor == '969981'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.HOME_CORE_EDITOR_PUSH_TOKEN }}
      TARGET_REPO: 969981/HOME-Live-Plugin-CHS
      MERGE_SHA: f549581b14f574d66c3f282fe8b32a3a95a2a9de
    steps:
      - name: Verify merged ancestry and exact cleanup refs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api "repos/$TARGET_REPO/compare/develop...$MERGE_SHA" | jq -e '.ahead_by == 0 and (.status == "behind" or .status == "identical")' >/dev/null
          gh auth setup-git --hostname github.com
          git init -q "$RUNNER_TEMP/home-pr64-cleanup"
          cd "$RUNNER_TEMP/home-pr64-cleanup"
          git remote add origin "https://github.com/$TARGET_REPO.git"
          delete_exact() {
            local branch="$1" expected="$2" ancestor="$3"
            local ref="refs/heads/$branch" actual
            actual="$(git ls-remote --heads origin "$ref" | cut -f1)"
            if [ -z "$actual" ]; then
              echo "$branch already absent"
              return
            fi
            test "$actual" = "$expected" || { echo "::error::Unexpected head for $branch"; exit 1; }
            gh api "repos/$TARGET_REPO/compare/develop...$ancestor" | jq -e '.ahead_by == 0 and (.status == "behind" or .status == "identical")' >/dev/null
            git push --force-with-lease="$ref:$expected" origin ":$ref"
            test -z "$(git ls-remote --heads origin "$ref")"
            echo "Verified deletion of $branch"
          }
          gh api "repos/$TARGET_REPO/compare/4f938c86ba667397a86d31437089507b2058323a...ca01277378c5e3589aa10268ad3f1dbff9fb4ae4" | jq -e '.ahead_by == 1 and .behind_by == 0 and (.files | length == 1) and .files[0].filename == "docs/devlog/ci/home-linked-scan-clean-46099550425-1.json" and .files[0].status == "added"' >/dev/null
          delete_exact fix/linked-box-map-read-status 4f938c86ba667397a86d31437089507b2058323a 4f938c86ba667397a86d31437089507b2058323a
          delete_exact ci/linked-scan-clean-46099550425-1 ca01277378c5e3589aa10268ad3f1dbff9fb4ae4 4f938c86ba667397a86d31437089507b2058323a
          echo "develop untouched; PR 64 source and diagnostic branches verified absent."
