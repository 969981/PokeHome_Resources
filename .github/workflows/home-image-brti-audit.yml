name: HOME image BRTI audit
on:
  workflow_dispatch:
  push:
    branches: [research/home-image-resource-audit]
    paths:
      - 'tools/home41_icon_brti_audit.py'
      - 'tools/home41_bntx_to_png.py'
      - '.github/workflows/home-image-brti-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/pokemon/icon_pokemon
            57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/appli/icon_item
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and existing BNTX tests
        run: |
          python -m py_compile tools/home41_icon_brti_audit.py tools/home41_bntx_to_png.py
          python -m unittest discover -s tools -p test_home41_bntx.py -v
      - name: Audit metadata and extract supported PNG
        run: |
          python tools/home41_icon_brti_audit.py --root . --out audit_output --decode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home41-icon-brti-audit
          path: audit_output/
          if-no-files-found: warn
