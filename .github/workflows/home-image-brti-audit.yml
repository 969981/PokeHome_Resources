name: HOME image BRTI audit
on:
  workflow_dispatch:
  push:
    branches: [research/home-image-resource-audit]
    paths:
      - 'tools/home41_icon_brti_audit.py'
      - 'tools/home41_bntx_to_png.py'
      - 'tools/home41_image_reverse_index.py'
      - 'tools/home41_selector_followup.py'
      - 'tools/home41_image_selector_model.py'
      - 'HomeImageResources/research/pokemon_image_selector_v2.csv'
      - '.github/workflows/home-image-brti-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            HomeImageResources/research
            57b83ea8c0af21ef26e2519b9580b373_NCA/0
            57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/appli
            57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/pokemon/icon_pokemon
            57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/pokemon/pokemon_list
            57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/pml/item
            57b83ea8c0af21ef26e2519b9580b373_NCA/1/system_resource/texture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoders
        run: python -m pip install texture2ddecoder==1.0.6 capstone==5.0.6
      - name: Compile and existing BNTX tests
        run: |
          python -m py_compile tools/home41_icon_brti_audit.py tools/home41_bntx_to_png.py tools/home41_image_reverse_index.py tools/home41_selector_followup.py
          python -m unittest discover -s tools -p test_home41_bntx.py -v
      - name: All SARC names and missing item keys
        run: python tools/home41_image_reverse_index.py --root . --out audit_output/reverse --mode archives
      - name: ELF image resource references
        run: python tools/home41_image_reverse_index.py --root . --out audit_output/elf --mode elf
      - name: Audit metadata and extract supported PNG
        run: python tools/home41_icon_brti_audit.py --root . --out audit_output/icons --decode
      - name: Exact image key joins and native selector evidence
        run: python tools/home41_selector_followup.py --root . --icons audit_output/icons --out audit_output/selector
      - name: Reproduce native image selector static model
        run: python tools/home41_image_selector_model.py --root . --icons audit_output/icons --out audit_output/selector/native_model_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home41-icon-brti-audit
          path: audit_output/
          if-no-files-found: error
