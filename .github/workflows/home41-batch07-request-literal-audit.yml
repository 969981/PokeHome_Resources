name: HOME41 Batch07 native Box Operation request literal audit
on:
  workflow_dispatch:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-batch07-request-literal-audit.yml'
      - 'tools/ghidra/home41_batch07_request_adrp_audit.py'
      - 'tools/ghidra/test_home41_batch07_request_adrp_audit.py'
permissions:
  contents: read
jobs:
  native-string-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout only exact source and scanner
        uses: actions/checkout@v4
        with:
          ref: '4.1.0'
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/ghidra/home41_batch07_request_adrp_audit.py
            tools/ghidra/test_home41_batch07_request_adrp_audit.py
            57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf
          persist-credentials: false
      - name: Python static self-checks
        run: |
          set -euo pipefail
          python -m py_compile tools/ghidra/home41_batch07_request_adrp_audit.py tools/ghidra/test_home41_batch07_request_adrp_audit.py
          python -m unittest discover -s tools/ghidra -p test_home41_batch07_request_adrp_audit.py -v
      - name: Scan original read-only ELF PC-relative strings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/home41-batch07"
          python tools/ghidra/home41_batch07_request_adrp_audit.py \
            --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf \
            --out "$RUNNER_TEMP/home41-batch07/request_literal_adrp_audit.json" \
            | tee "$RUNNER_TEMP/home41-batch07/summary.log"
          test -s "$RUNNER_TEMP/home41-batch07/request_literal_adrp_audit.json"
          python - "$RUNNER_TEMP/home41-batch07/request_literal_adrp_audit.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p['status']=='STATIC_SCOPE_ONLY'
          assert any('/api/box/operation' in x['literal'] for x in p['literal_summary'])
          print('Box endpoint bytes found; association with a request builder remains unproven')
          PY
      - name: Upload bounded reproducible evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HOME41-Batch07-Box-Operation-ADRP
          path: ${{ runner.temp }}/home41-batch07/
          retention-days: 30
          if-no-files-found: warn
