name: HOME 4.1.0 publish decoded Pokedex topics
on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-publish-topics.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home41-publish-topics
  cancel-in-progress: false
jobs:
  publish-topics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and real data geometry tests
        run: |
          python -m compileall -q tools
          python -m unittest discover -s tools -p test_home41_topics.py -v
          python -m unittest discover -s tools -p test_home41_pokedex_item.py -v
      - name: Extract and independently verify all 693 topics records
        run: |
          python tools/unpack_home41.py --root . --out Unpack --kind topics --resume
          python tools/unpack_home41.py --root . --out Unpack --verify --kind topics --strict
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('Unpack')
          d=json.loads((root/'_meta/summary.json').read_text())
          assert d['source_files']==12074
          assert d['status_counts'].get('unsupported',-1)==3,d
          assert d['status_counts'].get('failed',0)==0,d
          manifest=json.loads((root/'_meta/manifest.json').read_text())
          selected=[r for r in manifest['files'] if r.get('detected_format')=='topics']
          assert len(selected)==1
          row=selected[0]
          assert row['status']=='partial' and row['records']==693
          assert len(row['outputs'])==2
          print('topics row:',{k:row[k] for k in ('source_path','status','records','outputs')})
          print('complete mirror:',d)
          PY
      - name: Commit real mirrored outputs and matching manifests
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('Unpack')
          manifest=json.loads((root/'_meta/manifest.json').read_text())
          selected=[r for r in manifest['files'] if r.get('detected_format')=='topics']
          paths=[str(root/o['path']) for o in selected[0]['outputs']]
          paths += [str(x) for x in (root/'_meta').glob('*') if x.is_file()]
          for p in paths:
              subprocess.run(['git','add','-f','--',p],check=True)
          print('staged files:',len(paths))
          PY
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish all 693 topics slots and reduce unsupported to three fonts'
            git reset --hard HEAD
            git pull --rebase origin 4.1.0
            git push origin HEAD:4.1.0
          fi
