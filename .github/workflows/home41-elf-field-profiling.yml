name: HOME 4.1.0 ELF disassembly and item field profiling
on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-elf-field-profiling.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home41-elf-field-profiling
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARM64 disassembly dependency
        run: python -m pip install capstone==5.0.6
      - name: Verify researcher scripts and original ELF hash
        run: |
          python -m compileall -q tools
          python - <<'PY'
          import hashlib
          from pathlib import Path
          raw=Path('57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='bdb558f795710a89aee1af7ed3b5de359a4ca0b4fef6dcdca62e597b9d45df7a'
          PY
      - name: Decode exact ARM64 consumer windows
        run: |
          python tools/home41_elf_disasm_windows.py \
            --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf \
            --xrefs derived/4.1.0/native_elf_item_topics_xrefs.json \
            --out docs/UNPACK_ELF_ITEM_TOPICS_NATIVE_WINDOWS.md
          sed -n '1,30p' docs/UNPACK_ELF_ITEM_TOPICS_NATIVE_WINDOWS.md
      - name: Profile untyped fields and topic patterns
        run: |
          python tools/home41_item_topics_profile.py \
            --item 57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/pml/item/item.dat \
            --topics 57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/appli/mtt_pokedex/bin/topics_data.bin \
            --out derived/4.1.0/native_item_topics/
          python - <<'PY'
          import csv,json
          from pathlib import Path
          base=Path('derived/4.1.0/native_item_topics')
          data=list(csv.DictReader((base/'item_48byte_field_distributions.csv').open(encoding='utf-8-sig')))
          assert len(data)==48+24+12
          x=json.loads((base/'topics_data_structure_probe.json').read_text())
          assert x['source_bytes']==216336
          assert x['source_sha256']=='141be49529981e5bc56b6605c7f3223f3c506ee4753fb0ff2d3be16e792c3b8f'
          print('raw item profiles:',len(data),'topics u32:',x['u32_count'])
          PY
      - name: Commit audited evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- docs/UNPACK_ELF_ITEM_TOPICS_NATIVE_WINDOWS.md derived/4.1.0/native_item_topics/
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish native ELF instruction windows and item/topics field evidence'
            git reset --hard HEAD
            git pull --rebase origin 4.1.0
            git push origin HEAD:4.1.0
          fi
