name: HOME native learnset consumer audit
on:
  workflow_dispatch:
  push:
    branches: [research/home-image-resource-audit]
    paths:
      - 'tools/home41_native_learnset_scan.py'
      - 'tools/home41_learnset_code_crosswalk.py'
      - '.github/workflows/home-native-learnset-audit.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            57b83ea8c0af21ef26e2519b9580b373_NCA/0
            57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/pml/personal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv run tools/home41_personal_learnset_audit.py --out dist/learnset
      - run: uv run tools/home41_learnset_code_crosswalk.py --csv dist/learnset/personal_learnset_records.csv --out dist/native
      - run: uv run tools/home41_native_learnset_scan.py --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf --out dist/native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-native-learnset-evidence
          path: dist/native/
