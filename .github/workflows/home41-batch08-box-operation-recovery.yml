name: HOME41 Batch08 targeted Box Operation FDE recovery
on:
  workflow_dispatch:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-batch08-box-operation-recovery.yml'
      - 'tools/ghidra/Home41Batch08BoxOperationRecovery.java'
permissions:
  contents: read
  actions: read
jobs:
  targeted-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout targeted read-only analysis script
        uses: actions/checkout@v4
        with:
          ref: '4.1.0'
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/ghidra/Home41Batch08BoxOperationRecovery.java
          persist-credentials: false
      - name: Retrieve exact immutable native Ghidra project
        uses: actions/download-artifact@v4
        with:
          name: HOME41-Ghidra12-native-project
          repository: ${{ github.repository }}
          run-id: 42763137320
          path: ${{ runner.temp }}/project-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore disposable project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/HOME410-project" "$RUNNER_TEMP/home41-batch08"
          tar --zstd -xf "$RUNNER_TEMP/project-artifact/HOME410_ghidra_project.tar.zst" -C "$RUNNER_TEMP/HOME410-project"
          test -f "$RUNNER_TEMP/HOME410-project/HOME410.gpr"
          test -d "$RUNNER_TEMP/HOME410-project/HOME410.rep"
      - name: JDK 25 for Ghidra 12.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Exact Ghidra release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip' \
            --output "$RUNNER_TEMP/ghidra.zip"
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra-install"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra-install"
      - name: Recover only five previously unmapped FDEs
        shell: bash
        run: |
          set -euo pipefail
          HEADLESS="$(find "$RUNNER_TEMP/ghidra-install" -path '*/support/analyzeHeadless' -type f -print -quit)"
          test -n "$HEADLESS"
          bash "$HEADLESS" "$RUNNER_TEMP/HOME410-project" HOME410 \
            -process main.elf -noanalysis \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
            -postScript Home41Batch08BoxOperationRecovery.java "$RUNNER_TEMP/home41-batch08" \
            -log "$RUNNER_TEMP/home41-batch08/headless.log" \
            -scriptlog "$RUNNER_TEMP/home41-batch08/script.log"
          test -s "$RUNNER_TEMP/home41-batch08/focused_recovery.tsv"
          grep '^FDE' "$RUNNER_TEMP/home41-batch08/focused_recovery.tsv"
          grep '^C' "$RUNNER_TEMP/home41-batch08/focused_recovery.tsv" | head -n 30 || true
      - name: Upload static recovery evidence (never the modified temporary Ghidra project)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HOME41-Batch08-Focused-Box-Operation
          path: ${{ runner.temp }}/home41-batch08/
          retention-days: 30
          if-no-files-found: warn
