name: HOME supplemental image categories
on:
  workflow_dispatch:
  push:
    branches: [research/home-image-resource-audit]
    paths:
      - 'tools/home41_supplemental_images.py'
      - '.github/workflows/home-supplemental-images.yml'
permissions:
  contents: write
jobs:
  audit:
    if: github.ref == 'refs/heads/research/home-image-resource-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            tools
            HomeImageResources
            57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/appli
            57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/pokemon/icon_pokemon
            57b83ea8c0af21ef26e2519b9580b373_NCA/1/bin/message
            57b83ea8c0af21ef26e2519b9580b373_NCA/1/system_resource/texture
            Unpack/Android/4.1.0/images
            Unpack/Android/4.1.0/sprites
            Unpack/Android/4.1.0/_meta
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install texture2ddecoder==1.0.6 Pillow==12.0.0 capstone==5.0.6
      - name: Extract marking textures and classify Android exports
        run: |
          python -m py_compile tools/home41_supplemental_images.py
          python tools/home41_supplemental_images.py --root . --out supplemental_output
      - name: Validate image index and links
        run: |
          PYTHONPATH=tools python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from home41_supplemental_images import inspect_png
          p=Path('HomeImageResources/supplemental')
          d=json.loads((p/'index.json').read_text())
          for r in d['rows']:
              assert inspect_png(p/r['path'])['rgba_sha256']==r['rgba_sha256']
              assert hashlib.sha256(Path(r['source']).read_bytes()).hexdigest()==r['source_sha256']
          assert sum(r['platform']=='switch' and r['category']=='box_marking' for r in d['rows'])==30
          assert sum(r['category']=='achievement_atlas' for r in d['rows'])>=1
          print('source and decoded image hashes validated')
          PY
      - name: Archive supplemental pack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HomeImageResources/supplemental/
          if ! git diff --cached --quiet; then
            git commit -m 'assets: archive supplemental HOME marking and medal image evidence'
            for attempt in 1 2 3; do
              git fetch origin refs/heads/research/home-image-resource-audit
              git rebase FETCH_HEAD
              if git push origin HEAD:refs/heads/research/home-image-resource-audit; then exit 0; fi
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home41-supplemental-image-audit
          path: |
            supplemental_output/
            HomeImageResources/supplemental/
          if-no-files-found: error
