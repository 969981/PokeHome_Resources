name: HOME41 Batch10 native jump table and virtual dispatch audit
on:
  workflow_dispatch:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-batch10-dispatch-audit.yml'
      - 'tools/ghidra/home41_batch10_dispatch_audit.py'
permissions:
  contents: read
jobs:
  bounded-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout original ELF and exact audit implementation
        uses: actions/checkout@v4
        with:
          ref: '4.1.0'
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/ghidra/home41_batch07_request_adrp_audit.py
            tools/ghidra/home41_batch09_box_save_cfg.py
            tools/ghidra/home41_batch10_dispatch_audit.py
            57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf
          persist-credentials: false
      - name: Native decoder synthetic tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/ghidra/home41_batch07_request_adrp_audit.py tools/ghidra/home41_batch09_box_save_cfg.py tools/ghidra/home41_batch10_dispatch_audit.py
          python tools/ghidra/home41_batch10_dispatch_audit.py --self-test
      - name: Verify and audit immutable machine code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/home41-batch10"
          python tools/ghidra/home41_batch10_dispatch_audit.py \
            --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf \
            --out "$RUNNER_TEMP/home41-batch10/dispatch_audit.json" \
            | tee "$RUNNER_TEMP/home41-batch10/summary.log"
          python - "$RUNNER_TEMP/home41-batch10/dispatch_audit.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p['status']=='STATIC_INDIRECT_DISPATCH_ONLY_NOT_HTTP_ACK'
          assert len(p['gate']['cases'])==6
          assert p['box_indirect_counts']['BLR']==27
          assert p['box_indirect_counts']['BR']==1
          assert p['method_pointer_groups']['box_save']['state_function_va']=="0x0034c470"
          print("Original ELF, six-case decode, and 28 indirect sites validated.")
          PY
      - name: Upload bounded code-only proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HOME41-Batch10-Dispatch-Callback-Audit
          path: ${{ runner.temp }}/home41-batch10/
          retention-days: 30
          if-no-files-found: warn
