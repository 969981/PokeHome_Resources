name: HOME Personal Waza native getter audit
on:
  workflow_dispatch:
  push:
    branches: [research/home-image-resource-audit]
    paths:
      - 'tools/home41_native_pml_getters.py'
      - 'tools/home41_native_pml_getter_closure.py'
      - '.github/workflows/home-pml-native-getters.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            57b83ea8c0af21ef26e2519b9580b373_NCA/0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv run tools/home41_native_pml_getters.py --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf --out dist/getters
      - run: uv run tools/home41_native_pml_getter_closure.py --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf --out dist/getters
      - uses: actions/upload-artifact@v4
        with:
          name: home-native-pml-getters
          path: dist/getters/
