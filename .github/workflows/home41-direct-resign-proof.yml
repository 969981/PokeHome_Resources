name: HOME 4.1.0 direct apksigner-only root cause verification

on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-direct-resign-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home41-direct-resign-proof
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '4.1.0'
          filter: blob:none
          sparse-checkout: |
            Android/Smali/tools
            Android/Smali/tests
            Android/Smali/4.1.0/smali_classes3/jp/co/ilca/www/checksignature
            .github/workflows
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch SHA-matched official APK and verify local signature-reading code
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pillow
          python -m compileall -q Android/Smali/tools
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/969981/Home_Android.git "$RUNNER_TEMP/original-home"
          git -C "$RUNNER_TEMP/original-home" sparse-checkout set ROMS/4.1.0
          mapfile -t files < <(find "$RUNNER_TEMP/original-home/ROMS/4.1.0" -type f -name '*.apk')
          test "${#files[@]}" -eq 1
          echo "ORIGINAL_APK=${files[0]}" >> "$GITHUB_ENV"
          echo "8dee598028cd70441f645c8fff96b093b76778d625cdf07c60109eced50ffac1  ${files[0]}" | sha256sum -c -
          grep -F 'getApkContentsSigners' Android/Smali/4.1.0/smali_classes3/jp/co/ilca/www/checksignature/CheckSignatureCore.smali
          grep -F 'UnitySendMessage' Android/Smali/4.1.0/smali_classes3/jp/co/ilca/www/checksignature/CheckSignatureCore.smali >/dev/null
          mkdir -p direct-resign-evidence

      - name: Sign the original APK directly without apktool, zipalign or any DEX edits
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          tools_dir=$(find "$sdk_dir/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$tools_dir/apksigner"
          echo "BUILD_TOOLS=$tools_dir" >> "$GITHUB_ENV"
          "$tools_dir/apksigner" verify -v --print-certs "$ORIGINAL_APK" \
            | grep -E 'Verified using v[123] scheme|Signer #1 certificate SHA-256 digest' \
            > direct-resign-evidence/original_cert.txt
          keytool -genkeypair -noprompt -alias forensic-test \
            -keyalg RSA -keysize 2048 -validity 2 \
            -keystore "$RUNNER_TEMP/direct-resign.jks" \
            -storepass changeit -keypass changeit \
            -dname "CN=HOME 4.1.0 disposable test key"
          "$tools_dir/apksigner" sign --ks "$RUNNER_TEMP/direct-resign.jks" \
            --ks-key-alias forensic-test --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --out "$RUNNER_TEMP/home41-directly-resigned.apk" "$ORIGINAL_APK"
          "$tools_dir/apksigner" verify -v --print-certs "$RUNNER_TEMP/home41-directly-resigned.apk" \
            | grep -E 'Verified using v[123] scheme|Signer #1 certificate SHA-256 digest' \
            > direct-resign-evidence/test_cert.txt
          if cmp -s direct-resign-evidence/original_cert.txt direct-resign-evidence/test_cert.txt; then
            echo "Expected certificate difference; did not detect" >&2
            exit 1
          fi
          python Android/Smali/tools/audit_direct_resign.py \
            --original "$ORIGINAL_APK" \
            --resigned "$RUNNER_TEMP/home41-directly-resigned.apk" \
            --output direct-resign-evidence/payload_audit.json
          "$tools_dir/zipalign" -c -p 4 "$ORIGINAL_APK" || true
          "$tools_dir/zipalign" -c -p 4 "$RUNNER_TEMP/home41-directly-resigned.apk" || true
          echo "DIRECTLY_RESIGNED=$RUNNER_TEMP/home41-directly-resigned.apk" >> "$GITHUB_ENV"

      - name: Enable Android hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Direct-resign versus original Android 15 runtime A/B
        id: runtime
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python Android/Smali/tools/smali_runtime_probe.py --rebuilt "$DIRECTLY_RESIGNED" --original "$ORIGINAL_APK" --out direct-resign-evidence

      - name: Summarize real evidence without inventing error source
        if: always()
        shell: bash
        env:
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('direct-resign-evidence')
          summary=root/'comparison.json'
          if summary.exists():
              r=json.loads(summary.read_text())
              a,b=r.get('reconstructed',{}),r.get('reference',{})
              status=(
                'original_home_ui_passes_but_direct_resigned_does_not'
                if b.get('home_ui_verified') and not a.get('home_ui_verified')
                else 'both_home_ui_pass'
                if b.get('home_ui_verified') and a.get('home_ui_verified')
                else 'baseline_not_verified_or_probe_incomplete')
          else:
              r={'status':'emulator_incomplete'}
              status='emulator_incomplete'
          out={
              'status':status,
              'job':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'device_outcome':os.environ.get('RUNTIME_OUTCOME'),
              'apk_content_audit':json.loads((root/'payload_audit.json').read_text()) if (root/'payload_audit.json').exists() else None,
              'original_certificate_info':(root/'original_cert.txt').read_text().strip() if (root/'original_cert.txt').exists() else None,
              'test_certificate_info':(root/'test_cert.txt').read_text().strip() if (root/'test_cert.txt').exists() else None,
              'app_runtime':r,
              'caution':'A signing-only correlation does not independently prove whether the client or backend rejects the signature. No login, account creation or request manipulation was performed.'
          }
          target=Path('Android/Smali/4.1.0/DIRECT_RESIGN_PROOF.json')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('DIRECT_RESIGN_STATUS='+status)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
              f.write('## Direct apksigner-only control: no zipalign, no Smali/asset edits\n\n')
              f.write(f"- Status: `{status}`\n")
              f.write(f"- APK ZIP payload changed beyond signing: `{out['apk_content_audit'].get('non_signature_payload_modified') if out['apk_content_audit'] else 'unknown'}`\n")
              for k in ('reconstructed','reference'):
                  v=r.get(k,{})
                  f.write(f"- {k}: app UI={v.get('home_ui_verified')}, installed={v.get('install_ok')}, PID35={v.get('process_at_35s')}\n")
          PY

      - name: Upload screenshots and extracted certificate SHA256s
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home41-direct-apksigner-only-runtime-evidence
          path: direct-resign-evidence/
          retention-days: 7
          if-no-files-found: warn

      - name: Commit actual direct re-sign result to private repo
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f Android/Smali/4.1.0/DIRECT_RESIGN_PROOF.json
          if ! git diff --cached --quiet; then
            git commit -m 'analysis(android): direct signing-only runtime control [skip ci]'
            git fetch origin 4.1.0
            git rebase FETCH_HEAD
            git push origin HEAD:4.1.0
          fi

      - name: Deliberately fail if original succeeds but direct resign blocks bootstrap
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('Android/Smali/4.1.0/DIRECT_RESIGN_PROOF.json').read_text())
          if r['status']!='both_home_ui_pass':
              raise SystemExit('Signing-only control requires investigation: '+r['status'])
          PY
