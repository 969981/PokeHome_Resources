name: HOME41 Batch02 EH4/Dirty static evidence validation

on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-batch02-validation.yml'
      - 'tools/ghidra/home41_typed_batch02.tsv'
      - 'tools/ghidra/home41_partial_record_dirty_batch02.h'
      - 'tools/ghidra/home41_batch02_callchain_audit.py'
      - 'tools/ghidra/home41_verify_typed_batch.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact baseline C, typed batch and tools
        uses: actions/checkout@v4
        with:
          ref: 4.1.0
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/ghidra/home41_typed_batch02.tsv
            tools/ghidra/home41_partial_record_dirty_batch02.h
            tools/ghidra/home41_batch02_callchain_audit.py
            tools/ghidra/home41_verify_typed_batch.py
            derived/4.1.0/Ghidra_12.2_Run_42763137320/c/
            derived/4.1.0/Ghidra_12.2_Run_42763137320/annotation_v1/c_annotated/
      - name: Verify Python syntax and create output directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/home41-batch02"
          python -m py_compile tools/ghidra/home41_batch02_callchain_audit.py tools/ghidra/home41_verify_typed_batch.py
      - name: Verify 20 C entrypoints and signature widths
        shell: bash
        run: |
          set -euo pipefail
          python tools/ghidra/home41_verify_typed_batch.py \
            --tsv tools/ghidra/home41_typed_batch02.tsv \
            --expect-count 20 \
            --c-root derived/4.1.0/Ghidra_12.2_Run_42763137320/annotation_v1/c_annotated \
            --json-out "$RUNNER_TEMP/home41-batch02/signatures.json"
      - name: Audit 12 EH4 and Dirty callchain source assertions
        shell: bash
        run: |
          set -euo pipefail
          python tools/ghidra/home41_batch02_callchain_audit.py \
            --c-root derived/4.1.0/Ghidra_12.2_Run_42763137320/c \
            --out "$RUNNER_TEMP/home41-batch02/callchain.json"
      - name: Compile offset-layout assertions (64-bit C11)
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '#include "tools/ghidra/home41_partial_record_dirty_batch02.h"' 'int main(void){return 0;}' > "$RUNNER_TEMP/home41_layout.c"
          cc -std=c11 -m64 -Wall -Wextra -Werror -I. "$RUNNER_TEMP/home41_layout.c" -o "$RUNNER_TEMP/home41_layout"
          "$RUNNER_TEMP/home41_layout"
      - name: Archive machine-readable static audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOME41-Batch02-static-audit
          retention-days: 30
          if-no-files-found: warn
          path: ${{ runner.temp }}/home41-batch02/
