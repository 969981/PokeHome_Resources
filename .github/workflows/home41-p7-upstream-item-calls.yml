name: HOME 4.1.0 P7 Item8 upstream Native call audit
on:
  push:
    branches: ['4.1.0']
    paths:
      - '.github/workflows/home41-p7-upstream-item-calls.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home41-p7-upstream-item-calls
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compiler check and AArch64 Native dependency
        run: |
          python -m pip install capstone==5.0.6
          python -m py_compile tools/home41_native_p7_upstream_calls.py
      - name: Find actual item property function callers or registration pointers
        run: |
          python tools/home41_native_p7_upstream_calls.py \
            --elf 57b83ea8c0af21ef26e2519b9580b373_NCA/0/main.elf \
            --out derived/4.1.0/native_item_topics/p7_item_upstream_calls.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('derived/4.1.0/native_item_topics/p7_item_upstream_calls.json')
          d=json.loads(p.read_text())
          assert d['elf_sha256']=='bdb558f795710a89aee1af7ed3b5de359a4ca0b4fef6dcdca62e597b9d45df7a'
          assert d['code_words_4byte_scanned']>=1000000
          assert len(d['local_disassembly'])>180
          print('P7 branch hits:',d['direct_branch_hit_count'])
          PY
      - name: Commit original-ELF upstream xref results
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- derived/4.1.0/native_item_topics/p7_item_upstream_calls.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: P7 exact ELF upstream item effect selector B/BL and pointer candidates'
            git reset --hard HEAD
            for attempt in 1 2 3 4; do
              git pull --rebase origin 4.1.0
              if git push origin HEAD:4.1.0; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
